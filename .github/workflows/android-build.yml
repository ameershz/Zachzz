name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Extract ZIP project
        run: |
          unzip -o ameer-ai-assistant.zip -d project
          echo "ZIP extracted successfully"
          find project -maxdepth 3 -name gradlew


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Find and Build APK
        run: |

          GRADLE_FILE=$(find project -name gradlew | head -1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradlew not found inside ZIP"
            echo "Files inside project:"
            find project -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Gradle found at:"
          echo "$GRADLE_FILE"

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ameer-AI-APK
          path: |
            project/**/app/build/outputs/apk/debug/*.apk
