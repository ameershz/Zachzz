name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract and Fix Project Structure
        run: |
          echo "=== Extracting ZIP ==="

          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No zip file found!"
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d extracted_project

          cd extracted_project

          if [ -d "app" ] && [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "Creating missing root gradle files..."
            echo "include ':app'" > settings.gradle.kts
            echo "plugins { id('com.android.application') version '9.1.1' apply false; id('org.jetbrains.kotlin.android') version '1.9.0' apply false" > build.gradle.kts
          elif [ -d "كابتن-وصيانة" ]; then
            cd "كابتن-وصيانة"
          fi

          if [ ! -f "gradlew" ]; then
            echo "Gradlew missing. Installing system gradle and generating wrapper..."
            sudo apt-get update
            sudo apt-get install -y gradle
            gradle wrapper --gradle-version 9.3.1
          fi

          chmod +x gradlew

          echo "=== Checking Stable Firebase Signing Keystore ==="

          if [ ! -f "debug.keystore.base64" ]; then
            echo "ERROR: debug.keystore.base64 is missing!"
            exit 1
          fi

          tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore

          echo "=== Stable Keystore Fingerprint ==="

          keytool -list -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep -E "SHA1:|SHA256:"

          echo "=== Gradle Signing Report ==="
          ./gradlew signingReport

          echo "=== Starting Build ==="
          ./gradlew assembleDebug

      - name: Verify Final APK Certificate
        run: |
          APK=$(find extracted_project -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          echo "=== FINAL APK CERTIFICATE ==="

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs "$APK"

          echo "=== Checking expected SHA-1 ==="

          CERTS=$($ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs "$APK")

          echo "$CERTS" | grep -qi "F8:3A:F8:85:B9:8E:08:DB:BA:D6:61:19:E5:CD:E0:C7:58:77:19:ED"

          if [ $? -ne 0 ]; then
            echo "ERROR: FINAL APK DOES NOT HAVE EXPECTED F8 SHA-1!"
            exit 1
          fi

          echo "SUCCESS: FINAL APK SHA-1 IS F8:3A..."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaptainApp-Debug
          path: 'extracted_project/**/build/outputs/apk/debug/*.apk'
