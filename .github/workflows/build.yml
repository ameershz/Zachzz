name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract and Fix Project Structure
        run: |
          echo "=== Extracting ZIP ==="
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No zip file found!"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d extracted_project
          
          cd extracted_project
          
          if [ -d "app" ] && [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "Creating missing root gradle files..."
            echo "include ':app'" > settings.gradle.kts
            echo "plugins { id('com.android.application') version '9.1.1' apply false; id('org.jetbrains.kotlin.android') version '1.9.0' apply false }" > build.gradle.kts
          elif [ -d "كابتن-وصيانة" ]; then
            cd "كابتن-وصيانة"
          fi
          
          if [ ! -f "gradlew" ]; then
            echo "Gradlew missing. Installing system gradle and generating wrapper..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper --gradle-version 9.3.1
          fi
          
          chmod +x gradlew
          echo "=== Starting Build ==="
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaptainApp-Debug
          path: '**/build/outputs/apk/debug/*.apk'
